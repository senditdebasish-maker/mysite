# ────────────────────────────────────────────────────────────────
#  XAMPP Apache  →  Node app reverse proxy (mysite)
#  Copy the block for YOUR scenario into C:\xampp\apache\conf\httpd.conf
#  (or into a <VirtualHost> in conf\extra\httpd-vhosts.conf)
#
#  If httpd.conf has these lines commented out, uncomment them first:
#    LoadModule proxy_module modules/mod_proxy.so
#    LoadModule proxy_http_module modules/mod_proxy_http.so
#    LoadModule headers_module modules/mod_headers.so
#
#  Then RESTART Apache from the XAMPP control panel.
#  Node must be running on port 8000 BEFORE Apache can proxy to it:
#  run start-windows.bat (or: node --experimental-sqlite server/server.js)
# ────────────────────────────────────────────────────────────────


# ══ SCENARIO 1 (recommended) — dedicate the whole domain/port to the app ══
# Everything on yourdomain.tld goes to the Node app; htdocs is not used.
<VirtualHost *:80>
    ServerName yourdomain.tld
    # ServerAlias www.yourdomain.tld

    ProxyPreserveHost On
    ProxyPass        /   http://127.0.0.1:8000/
    ProxyPassReverse /   http://127.0.0.1:8000/

    ErrorLog  logs/mysite-error.log
    CustomLog logs/mysite-access.log combined
</VirtualHost>

# HTTPS: prefer a real cert via XAMPP + win-acme/certbot,
# then duplicate the VirtualHost on *:443 with SSLEngine On.


# ══ SCENARIO 2 — host the app under a subpath: yourdomain.tld/mysite/ ══
# NOTE: after enabling this, open the installer at
#   https://yourdomain.tld/mysite/setup.html?api=/mysite/api
# (the ?api= override tells the wizard where its API lives)
# Subdomain (Scenario 1) is strongly preferred — fewer edge cases.
ProxyPass        /mysite/   http://127.0.0.1:8000/
ProxyPassReverse /mysite/   http://127.0.0.1:8000/


# ══ Scenario 3 — LAN-only preview on the XAMPP machine (no DNS needed) ═══
# Just leave Apache alone for this site and use:
#   http://localhost:8000            (same machine)
#   http://192.168.x.x:8000          (other devices on your LAN — allow
#                                    inbound TCP 8000 in Windows Firewall)
